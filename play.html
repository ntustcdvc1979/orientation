<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>尋寶啟航｜新生入口 - 台科大天心伙食團 迎新</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFCF2">
<link rel="icon" href="assets/logo1.webp">
<link rel="stylesheet" href="assets/theme.css">
<style>
  body{
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    line-height:1.7;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    background:
      radial-gradient(40rem 26rem at 10% -8%, rgba(242,167,44,.20), transparent 62%),
      radial-gradient(36rem 24rem at 95% 4%, rgba(169,206,59,.22), transparent 62%);
  }

  .wrap{
    width:100%;
    max-width:30rem;
    margin:0 auto;
    padding:1rem 1.1rem 3rem;
  }

  /* ---------- 上方狀態列 ---------- */
  .top{
    display:flex;
    align-items:center;
    gap:.6rem;
    padding:.6rem .2rem 1rem;
    font-size:.85rem;
    font-weight:800;
    color:var(--ink-soft);
  }
  .top img{width:2rem;height:auto;}
  .top .me{margin-left:auto;color:var(--green-dark);}

  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:1.4rem;
    padding:1.35rem;
    box-shadow:0 .35rem 0 rgba(51,51,51,.06);
  }

  h1{margin:.2rem 0 .5rem;font-size:1.85rem;font-weight:900;line-height:1.35;}
  h2{margin:0 0 1rem;font-size:1.42rem;font-weight:900;line-height:1.5;}
  p{margin:0 0 .9rem;}
  .quiet{color:var(--ink-soft);font-size:1.02rem;}

  /* ---------- 輸入名字 ---------- */
  .field label{display:block;margin-bottom:.35rem;font-size:.95rem;font-weight:800;}
  .field input{
    width:100%;
    padding:.85rem 1rem;
    border:2px solid var(--line);
    border-radius:.9rem;
    background:#FFFDF7;
    font-family:inherit;
    font-size:1.15rem;
    color:inherit;
  }
  .field input:focus{outline:none;border-color:var(--orange);background:#fff;}
  .err{display:block;margin-top:.4rem;font-size:.85rem;font-weight:700;color:var(--err);}

  .btn--big{width:100%;padding:1rem;font-size:1.1rem;margin-top:1rem;}

  /* ---------- 題目 ---------- */
  .qnum{
    font-size:.92rem;
    font-weight:900;
    letter-spacing:.14em;
    color:var(--orange-dark);
  }
  .opts{list-style:none;margin:0;padding:0;display:grid;gap:.55rem;}
  .opt{
    display:flex;
    align-items:center;
    gap:.7rem;
    width:100%;
    padding:.9rem 1rem;
    border:2px solid var(--line);
    border-radius:1rem;
    background:#fff;
    color:inherit;
    font-family:inherit;
    font-size:1.14rem;
    line-height:1.45;
    text-align:left;
    cursor:pointer;
  }
  .opt:active{transform:scale(.98);}
  .opt__k{
    flex:none;
    width:1.9rem;height:1.9rem;
    display:grid;place-items:center;
    border-radius:50%;
    background:#F4EFE0;
    font-size:.8rem;font-weight:900;
    color:var(--ink-soft);
  }
  .opt.on{border-color:var(--green-dark);background:rgba(169,206,59,.16);}
  .opt.on .opt__k{background:var(--green-dark);color:#fff;}

  .sent{
    margin-top:1rem;
    padding:.7rem 1rem;
    border-radius:.8rem;
    background:rgba(169,206,59,.16);
    font-weight:800;
    font-size:1.05rem;
    text-align:center;
    color:var(--green-dark);
  }

  /* ---------- 結果 ---------- */
  .rhead{
    text-align:center;
    padding:1.5rem 1.2rem;
    border-radius:1.4rem 1.4rem 0 0;
    background:linear-gradient(160deg,rgba(242,167,44,.18),rgba(169,206,59,.22));
    border:2px solid var(--line);
    border-bottom:none;
  }
  .rhead .e{display:block;font-size:4rem;line-height:1.2;}
  .rhead h1{margin:.2rem 0 0;}
  .rhead .en{margin:0;font-size:.95rem;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;}
  .rbody{
    border:2px solid var(--line);
    border-top:none;
    border-radius:0 0 1.4rem 1.4rem;
    background:var(--card);
    padding:1.35rem;
    box-shadow:0 .35rem 0 rgba(51,51,51,.06);
  }
  .tag{
    margin:0 0 1rem;
    padding:.7rem .9rem;
    border-left:.3rem solid var(--green);
    background:rgba(169,206,59,.12);
    border-radius:.25rem .7rem .7rem .25rem;
    font-weight:800;
  }
  .traits{display:flex;flex-wrap:wrap;gap:.35rem;list-style:none;margin:1rem 0 0;padding:0;}
  .traits li{
    padding:.25rem .8rem;
    border-radius:999px;
    background:#F4EFE0;
    font-size:.92rem;font-weight:700;
    color:var(--ink-soft);
  }

  /* ---------- 看投影幕 ---------- */
  .look{text-align:center;}
  .look .e{display:block;font-size:4rem;line-height:1.3;}
  .look h1{margin:.3rem 0 .4rem;}
  .mission{
    margin-top:1rem;
    padding:.9rem 1rem;
    border-left:.3rem solid var(--orange);
    background:rgba(242,167,44,.12);
    border-radius:.25rem .7rem .7rem .25rem;
    text-align:left;
    font-weight:700;
  }

  .foot{margin-top:1.5rem;text-align:center;font-size:.8rem;color:var(--ink-soft);}
  .warn{
    margin-bottom:1rem;
    padding:.7rem .9rem;
    border-radius:.8rem;
    background:#FFF3F1;
    border:2px solid var(--err);
    font-size:.88rem;
    font-weight:700;
    color:var(--err);
  }
</style>
</head>
<body>
<main class="wrap">

  <div class="top">
    <img src="assets/logo1.webp" alt="崇德志工社">
    <span id="where">尋寶啟航</span>
    <span class="me" id="me"></span>
  </div>

  <div class="warn" id="warn" hidden></div>
  <div id="view"></div>

  <p class="foot">台科大崇德志工社 NTUST CDVC</p>
</main>

<script src="assets/settings.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/quiz-data.js"></script>
<script src="assets/cards-data.js"></script>
<script src="assets/net.js"></script>
<script>
(function () {
  "use strict";

  var QUIZ = window.CDVC_QUIZ;
  var CARDS = window.CDVC_CARDS;
  var NET = window.CDVC_NET;

  var $ = function (id) { return document.getElementById(id); };
  var KEYS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  var NAME_KEY = "cdvc:name:" + NET.room;

  var me = { name: "", answers: {} };
  var state = null;
  var draft = null;      // 複選題還沒送出的選擇
  var lastKey = "";      // 畫面有變才重畫，不然打字打到一半會被洗掉

  try { me.name = localStorage.getItem(NAME_KEY) || ""; } catch (e) { /* 無痕 */ }

  /* ============================================================
     畫面
     ============================================================ */
  function screenKey() {
    if (!me.name) { return "join"; }
    if (!state) { return "wait"; }
    if (state.kind === "question") { return "q" + state.qi + ":" + state.sub; }
    if (state.kind === "map" || state.kind === "persona" ||
        (state.kind === "key" && state.i !== undefined && state.part === "q1")) { return "result"; }
    return state.part + ":" + state.kind + ":" + (state.mi == null ? "" : state.mi) + ":" + (state.sub || "");
  }

  function render(force) {
    var k = screenKey();
    if (!force && k === lastKey) { return; }
    lastKey = k;

    $("me").textContent = me.name ? "👋 " + me.name : "";
    $("where").textContent = state && state.label ? partName() : "尋寶啟航";

    if (!me.name) { return void ($("view").innerHTML = viewJoin()); }
    if (!state) { return void ($("view").innerHTML = viewWait()); }

    if (state.kind === "question") {
      $("view").innerHTML = state.sub === "answer" ? viewQuestion() : viewSent();
      return;
    }
    if (state.part === "q1" && (state.kind === "map" || state.kind === "persona" || state.kind === "key")) {
      $("view").innerHTML = viewResult();
      return;
    }
    $("view").innerHTML = viewLook();
  }

  function partName() {
    return {
      intro: "序章・藏寶圖",
      q1: "第一段・認識自己",
      q2: "第二段・找到同伴",
      q3: "第三段・實踐服務",
      q4: "終點・開箱",
      end: "終章・啟航"
    }[state.part] || "尋寶啟航";
  }

  function viewJoin() {
    return '' +
      '<div class="card">' +
        '<h1>先報上名來 🏴‍☠️</h1>' +
        '<p class="quiet">投影幕上會出現你的名字，也會用來標出你在四個象限的哪一區。暱稱、綽號都可以。</p>' +
        '<div class="field">' +
          '<label for="i-name">你的名字</label>' +
          '<input type="text" id="i-name" maxlength="12" autocomplete="off" ' +
            'placeholder="例如：小柯" enterkeyhint="go">' +
          '<span class="err" id="e-name" hidden></span>' +
        "</div>" +
        '<button class="btn btn--big" type="button" id="b-join">上船 →</button>' +
      "</div>";
  }

  function viewWait() {
    return '' +
      '<div class="card look">' +
        '<span class="e">⚓</span>' +
        "<h1>上船了，等主持人開始</h1>" +
        '<p class="quiet">接下來的題目會出現在這裡，跟著投影幕的節奏走就好。</p>' +
      "</div>";
  }

  function viewQuestion() {
    var q = QUIZ.QUESTIONS[state.qi];
    var mine = me.answers[state.qi];
    var picked = q.multi
      ? (draft && draft.qi === state.qi ? draft.list : QUIZ.asList(mine))
      : (mine === undefined ? -1 : mine);

    return '' +
      '<div class="card">' +
        '<p class="qnum">第 ' + (state.qi + 1) + " 題 / 共 " + QUIZ.QUESTIONS.length + " 題" +
          (q.multi ? "　·　可複選" : "") + "</p>" +
        "<h2>" + esc(q.q) + "</h2>" +
        '<ul class="opts">' +
          q.opts.map(function (o, n) {
            var on = q.multi ? picked.indexOf(n) >= 0 : picked === n;
            return "<li>" +
              '<button class="opt' + (on ? " on" : "") + '" type="button" data-pick="' + n + '">' +
                '<span class="opt__k">' + (on ? "✓" : KEYS.charAt(n)) + "</span>" +
                "<span>" + esc(o.t) + "</span>" +
              "</button></li>";
          }).join("") +
        "</ul>" +
        (q.multi
          ? '<button class="btn btn--big" type="button" id="b-send">送出這題</button>'
          : "") +
        (mine !== undefined && mine !== null
          ? '<p class="sent">✓ 已送出，可以改，等主持人換下一題</p>'
          : "") +
      "</div>";
  }

  function viewSent() {
    var q = QUIZ.QUESTIONS[state.qi];
    var mine = me.answers[state.qi];
    var text = QUIZ.asList(mine).map(function (n) {
      return q.opts[n] ? q.opts[n].t : "";
    }).filter(Boolean).join("、");

    return '' +
      '<div class="card look">' +
        '<span class="e">📊</span>' +
        "<h1>大家的答案在投影幕上</h1>" +
        (text
          ? '<p class="quiet">你選的是<br><b>' + esc(text) + "</b></p>"
          : '<p class="quiet">這題你沒有作答，沒關係，繼續下一題。</p>') +
      "</div>";
  }

  function viewResult() {
    if (!Object.keys(me.answers).length) {
      return '<div class="card look"><span class="e">🧭</span><h1>這一輪你沒作答</h1>' +
             '<p class="quiet">沒關係，抬頭看投影幕，下一關一起玩。</p></div>';
    }
    var t = QUIZ.TYPES[QUIZ.typeOf(me.answers)];
    return '' +
      '<div class="rhead">' +
        '<p class="qnum">你的志工人格是</p>' +
        '<span class="e">' + t.emoji + "</span>" +
        "<h1>" + esc(t.name) + "</h1>" +
        '<p class="en">' + esc(t.en) + "</p>" +
      "</div>" +
      '<div class="rbody">' +
        '<p class="tag">' + esc(t.tagline) + "</p>" +
        "<p>" + esc(t.desc) + "</p>" +
        '<ul class="traits">' +
          t.traits.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") +
        "</ul>" +
        '<p class="sent" style="margin-top:1.2rem">📽️ 到投影幕上找找你在哪一區</p>' +
      "</div>";
  }

  function viewLook() {
    var body = {
      intro: ["⚓", "上船了，等主持人開始", "接下來的題目會出現在這一頁，跟著投影幕的節奏走就好。"],
      q1: ["🧭", "第一段・認識自己", "等一下題目會出現在這裡，主持人說開始再作答。"],
      q2: ["🍲", "第二段・找到同伴", "伙食團不只是煮飯，是用一道料理感動另一個人。投影幕出情境，手上的卡有解的就站起來舉高，說出卡片上寫的功效。"],
      q3: ["🤝", "第三段・實踐服務", "🙊 比劃猴只能比手畫腳　🙉 傳話猴只能說　🙈 猜題猴閉眼睛猜。"],
      q4: ["💎", "終點・開箱", "往中間靠，食材卡舉起來，看鏡頭！"],
      end: ["⛵", "啟航", "抬頭看投影幕。"]
    }[state.part] || ["🗺️", "看投影幕", "跟著主持人的節奏走。"];

    var mission = "";
    if (state.kind === "mission" && state.mi !== null && CARDS.MISSIONS[state.mi]) {
      var m = CARDS.MISSIONS[state.mi];
      mission = '<div class="mission">' + m.icon + "　" + esc(m.situation) + "</div>";
    }

    return '' +
      '<div class="card look">' +
        '<span class="e">' + body[0] + "</span>" +
        "<h1>" + esc(body[1]) + "</h1>" +
        '<p class="quiet">' + esc(body[2]) + "</p>" +
        mission +
      "</div>";
  }

  /* ============================================================
     互動
     ============================================================ */
  document.addEventListener("click", function (e) {
    var join = e.target.closest("#b-join");
    if (join) { return void doJoin(); }

    var pick = e.target.closest("[data-pick]");
    if (pick) { return void doPick(Number(pick.getAttribute("data-pick"))); }

    var send = e.target.closest("#b-send");
    if (send) { return void doSendMulti(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "i-name") { doJoin(); }
  });

  function doJoin() {
    var input = $("i-name");
    var name = (input.value || "").trim().replace(/\s+/g, " ");
    if (!name) {
      $("e-name").hidden = false;
      $("e-name").textContent = "請輸入名字";
      input.focus();
      return;
    }
    me.name = name;
    try { localStorage.setItem(NAME_KEY, name); } catch (err) { /* 無痕 */ }

    NET.savePlayer({ name: name, joinedAt: Date.now() })["catch"](function () {
      showWarn("名字送不出去，請確認網路後重新整理。");
    });
    render(true);
  }

  function doPick(n) {
    if (!state || state.kind !== "question" || state.sub !== "answer") { return; }
    var qi = state.qi;
    var q = QUIZ.QUESTIONS[qi];

    if (!q.multi) {
      me.answers[qi] = n;
      NET.saveAnswer(qi, n)["catch"](function () { showWarn("答案送不出去，請確認網路。"); });
      render(true);
      return;
    }

    // 複選：先在本機記著，按了送出才寫回去
    var list = (draft && draft.qi === qi) ? draft.list.slice() : QUIZ.asList(me.answers[qi]).slice();
    var at = list.indexOf(n);

    if (at >= 0) { list.splice(at, 1); }
    else if (q.opts[n].none) { list = [n]; }
    else {
      list = list.filter(function (x) { return !q.opts[x].none; });
      list.push(n);
    }

    draft = { qi: qi, list: list };
    render(true);
  }

  function doSendMulti() {
    if (!state || state.kind !== "question") { return; }
    var qi = state.qi;
    var list = (draft && draft.qi === qi) ? draft.list : [];
    me.answers[qi] = list;
    NET.saveAnswer(qi, list)["catch"](function () { showWarn("答案送不出去，請確認網路。"); });
    draft = null;
    render(true);
  }

  function showWarn(msg) {
    $("warn").hidden = false;
    $("warn").textContent = "⚠️ " + msg;
  }

  /* ============================================================
     連線
     ============================================================ */
  NET.onStatus = function (ok) {
    if (ok) { $("warn").hidden = true; }
    else { showWarn("和投影幕斷線了，等一下網路回來就會自動接上。"); }
  };

  NET.init("play").then(function (r) {
    if (r.mode !== "firebase") {
      showWarn("目前是本機模式，這支手機不會同步到投影幕。請通知工作人員。");
    }
    if (me.name) {
      NET.savePlayer({ name: me.name, joinedAt: Date.now() })["catch"](function () {});
    }
    render(true);

    // 手機重整過的話，把自己先前的作答撈回來，結果頁才算得準
    NET.loadMe().then(function (mine) {
      if (!mine) { return; }
      if (mine.name && !me.name) { me.name = mine.name; }
      if (mine.answers) {
        Object.keys(mine.answers).forEach(function (qi) {
          if (me.answers[qi] === undefined) { me.answers[qi] = mine.answers[qi]; }
        });
      }
      render(true);
    })["catch"](function () { /* 撈不到就當作沒作答過 */ });
  });

  NET.onState(function (s) {
    state = s;
    render(false);
  });

  render(true);
})();
</script>
</body>
</html>
