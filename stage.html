<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尋寶啟航｜投影幕 - 台科大天心伙食團 迎新</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo1.webp">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 字級跟著視窗走，投影機不管是 1024 還是 1920 都塞得剛好 */
  html{font-size:clamp(16px, 0.78vw + 0.78vh, 36px);}

  /* 藏寶圖：暖黃的舊紙，配上金、火橘、海水青 */
  body{
    background:var(--paper);
    color:var(--ink);
    height:100vh;
    overflow:hidden;
    cursor:none;
  }
  body.show-ui{cursor:default;}

  /* 底色的光暈與紙紋 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(85rem 55rem at 6% -12%, rgba(233,163,23,.42), transparent 60%),
      radial-gradient(75rem 52rem at 98% 2%, rgba(14,140,143,.26), transparent 58%),
      radial-gradient(85rem 60rem at 52% 122%, rgba(226,98,28,.30), transparent 60%),
      repeating-linear-gradient(48deg, rgba(122,85,38,.05) 0 2px, transparent 2px 10px);
  }

  /* 舊紙的四邊燒灼感，讓亮底不會刺眼 */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    box-shadow:inset 0 0 16rem rgba(90,52,18,.34);
  }

  /* 裝飾層：羅盤、航線、藏寶點 */
  .deco{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.13;
  }
  .deco svg{width:100%;height:100%;}

  /* ---------- 版面骨架 ---------- */
  .rail{
    position:fixed;
    top:0; left:0; right:0;
    z-index:3;
    display:flex;
    align-items:center;
    gap:1rem;
    padding:1rem 2rem;
    font-size:1rem;
  }
  .rail__room{
    font-weight:900;
    letter-spacing:.12em;
    color:var(--ink-2);
  }
  .rail__keys{display:flex;gap:.55rem;margin-left:auto;}
  .rail__key{
    line-height:1.3;
    width:2.7rem;height:2.7rem;
    display:grid;place-items:center;
    border-radius:50%;
    border:.14rem solid rgba(122,85,38,.28);
    background:rgba(255,255,255,.55);
    font-size:1.3rem;
    filter:grayscale(1);
    opacity:.4;
    transition:all .5s ease;
  }
  .rail__key.on{
    filter:none;
    opacity:1;
    border-color:var(--flame);
    background:#fff;
    box-shadow:0 0 0 .22rem rgba(242,167,44,.35), 0 .3rem .8rem rgba(90,52,18,.18);
  }

  /* 結束卡東西多，邊界收窄，把高度讓給行事曆 */
  main.screen--tight{padding:3.4rem 2.6rem 1.8rem;}

  main.screen{
    position:relative;
    z-index:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:4.5rem 3.5rem 4rem;
    text-align:center;
  }

  /* ---------- 共用零件 ---------- */
  .eyebrow{
    margin:0 0 .6rem;
    font-size:1.15rem;
    font-weight:900;
    letter-spacing:.34em;
    color:var(--flame);
  }
  .huge{
    margin:0;
    font-size:5.2rem;
    font-weight:900;
    line-height:1.12;
    letter-spacing:.02em;
    background:linear-gradient(150deg,#F2A72C 0%,#E2621C 48%,#C4453B 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 .12rem 0 rgba(255,255,255,.85));
  }
  .big{margin:0;font-size:3.4rem;font-weight:900;line-height:1.25;}
  .mid{margin:0;font-size:2.1rem;font-weight:800;line-height:1.45;}
  .lede{
    margin:1.2rem auto 0;
    max-width:52rem;
    font-size:1.6rem;
    line-height:1.7;
    color:var(--ink-2);
  }
  .lede b{color:var(--flame);}
  .quiet{color:var(--ink-2);opacity:.8;}
  /* emoji 的字身比一般文字高，行高給 1.1 會讓它的頭超出行框壓到上一行，
     所以這裡一律留寬一點 */
  .emoji{display:block;font-size:6rem;line-height:1.35;
    filter:drop-shadow(0 .3rem .5rem rgba(90,52,18,.22));}

  .chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;}
  .chip{
    padding:.3rem 1.05rem;
    border-radius:999px;
    background:#fff;
    border:.12rem solid rgba(122,85,38,.22);
    box-shadow:0 .16rem 0 rgba(90,52,18,.10);
    font-size:1.15rem;
    font-weight:800;
    color:var(--ink);
  }

  /* 序章的四段旅程 */
  .beats{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;align-items:stretch;margin-top:1.8rem;}
  .beat{
    display:flex;flex-direction:column;justify-content:center;
    min-width:11rem;
    padding:1.1rem 1.3rem;
    border-radius:1.1rem;
    background:#fff;
    border:.14rem solid rgba(122,85,38,.2);
    box-shadow:0 .28rem 0 rgba(90,52,18,.12);
  }
  .beat b{display:block;font-size:2.6rem;line-height:1.3;}
  .beat span{margin-top:.35rem;font-size:1.35rem;font-weight:900;}
  .beat i{font-style:normal;font-size:.95rem;color:var(--ink-2);letter-spacing:.16em;}
  .beat__arrow{align-self:center;font-size:2rem;color:var(--flame);opacity:.65;}

  /* ---------- 封面 ---------- */
  .cover{display:grid;grid-template-columns:1.25fr .75fr;gap:3.5rem;align-items:center;width:100%;max-width:88rem;text-align:left;}
  .cover__logo{width:7rem;height:auto;margin-bottom:1.2rem;}
  .cover__qr{text-align:center;}
  .cover__qr .qr{
    width:min(26rem,30vw);
    margin:0 auto;
    border:.35rem solid #fff;
    box-shadow:0 .5rem 1.4rem rgba(90,52,18,.28);
  }
  .cover__scan{margin:.9rem 0 0;font-size:1.5rem;font-weight:900;color:var(--flame);}
  .cover__url{margin:.2rem 0 0;font-size:1rem;word-break:break-all;color:var(--ink-2);opacity:.75;}

  .crew{margin-top:1.6rem;}
  .crew__count{font-size:2.4rem;font-weight:900;color:var(--teal);}
  .crew__names{
    margin-top:.7rem;
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
    max-height:9rem;
    overflow:hidden;
  }
  .crew__names .chip{font-size:1rem;animation:pop .45s ease-out;}
  @keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}

  /* ---------- 題目 ---------- */
  .q{width:100%;max-width:80rem;}
  .q__num{font-size:1.2rem;letter-spacing:.3em;color:var(--flame);font-weight:900;}
  .q__title{margin:.5rem 0 2rem;font-size:3.6rem;font-weight:900;line-height:1.3;}
  .q__opts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:.8rem;
    list-style:none;
    margin:0;padding:0;
    text-align:left;
  }
  .q__opts.one{grid-template-columns:1fr;max-width:50rem;margin:0 auto;}
  .q__opt{
    display:flex;
    align-items:center;
    gap:1rem;
    padding:.85rem 1.3rem;
    border:.14rem solid rgba(122,85,38,.2);
    border-radius:1rem;
    background:#fff;
    box-shadow:0 .22rem 0 rgba(90,52,18,.12);
    font-size:1.65rem;
    font-weight:800;
  }
  .q__key{
    flex:none;
    width:2.5rem;height:2.5rem;
    display:grid;place-items:center;
    border-radius:50%;
    background:linear-gradient(135deg,var(--amber),var(--flame));
    color:#fff;
    font-size:1.2rem;
    font-weight:900;
  }
  .q__done{margin-top:1.8rem;font-size:2rem;font-weight:900;}
  .q__done b{color:var(--teal);font-size:2.8rem;}

  /* 統計長條 */
  .bars{list-style:none;margin:0;padding:0;display:grid;gap:.7rem;width:100%;max-width:72rem;text-align:left;}
  .bar{display:grid;grid-template-columns:3rem 1fr 5rem;align-items:center;gap:1rem;}
  .bar__key{
    width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:50%;
    background:linear-gradient(135deg,var(--amber),var(--flame));
    color:#fff;font-weight:900;font-size:1.1rem;
  }
  .bar__track{
    position:relative;height:3.2rem;border-radius:.7rem;
    background:#fff;border:.12rem solid rgba(122,85,38,.18);
    overflow:hidden;
  }
  .bar__fill{
    position:absolute;inset:0 auto 0 0;
    background:linear-gradient(90deg,var(--amber),var(--flame));
    width:0;
    transition:width .9s cubic-bezier(.2,.8,.2,1);
  }
  .bar__label{
    position:absolute;
    inset:0;
    display:flex;align-items:center;
    padding:0 1rem;
    font-size:1.35rem;font-weight:900;
    color:var(--ink);
  }
  .bar__n{font-size:1.6rem;font-weight:900;text-align:right;color:var(--flame);}

  /* ---------- 四象限地圖 ---------- */
  .map{position:relative;width:min(92vw,118vh);aspect-ratio:16/9;--dot-size:1.7rem;}
  .map__grid{
    position:absolute;inset:0;border-radius:1.2rem;overflow:hidden;
    background:
      conic-gradient(from 0deg at 50% 50%,
        rgba(226,98,28,.16)  0deg  90deg,
        rgba(142,69,133,.16) 90deg 180deg,
        rgba(127,180,50,.18) 180deg 270deg,
        rgba(14,140,143,.16) 270deg 360deg),
      #fff;
    border:.16rem solid rgba(122,85,38,.24);
    box-shadow:0 .5rem 1.2rem rgba(90,52,18,.16);
  }
  .map__axis{position:absolute;background:rgba(122,85,38,.3);}
  .map__axis.h{left:0;right:0;top:50%;height:.12rem;}
  .map__axis.v{top:0;bottom:0;left:50%;width:.12rem;}
  .map__q{
    position:absolute;
    z-index:2;
    margin:.4rem;
    padding:.5rem .85rem;
    border-radius:.8rem;
    background:rgba(255,255,255,.74);
    font-weight:900;
    line-height:1.25;
  }
  .map__q b{display:block;font-size:2.2rem;}
  .map__q i{font-style:normal;font-size:1.25rem;color:var(--ink-2);}
  .map__q.tl{top:0;left:0;text-align:left;}
  .map__q.tr{top:0;right:0;text-align:right;}
  .map__q.bl{bottom:0;left:0;text-align:left;}
  .map__q.br{bottom:0;right:0;text-align:right;}
  .map__ax{position:absolute;z-index:2;font-size:1.35rem;font-weight:900;color:var(--ink-2);opacity:.85;letter-spacing:.1em;}
  .map__ax.up{top:.4rem;left:50%;transform:translateX(-50%);}
  .map__ax.down{bottom:.4rem;left:50%;transform:translateX(-50%);}
  .map__ax.left{left:.5rem;top:50%;transform:translateY(-50%);}
  .map__ax.right{right:.5rem;top:50%;transform:translateY(-50%);}

  .dot{
    position:absolute;
    transform:translate(-50%,-50%) scale(.4);
    opacity:0;
    display:flex;align-items:center;gap:.28rem;
    padding:.25rem .8rem;
    border-radius:999px;
    background:#fff;
    border:.16rem solid currentColor;
    box-shadow:0 .2rem .4rem rgba(90,52,18,.22);
    font-size:var(--dot-size);
    font-weight:900;
    white-space:nowrap;
    animation:land .5s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  .dot span{color:var(--ink);}
  @keyframes land{to{opacity:1;transform:translate(-50%,-50%) scale(1);}}

  .legend{display:flex;flex-wrap:wrap;gap:1.1rem;justify-content:center;margin-top:1.1rem;font-size:1.45rem;font-weight:900;}
  .legend i{font-style:normal;}

  /* ---------- 六大類 ---------- */
  .groups{display:grid;gap:.6rem;width:100%;max-width:78rem;}
  .group{
    display:grid;
    grid-template-columns:14rem 1fr;
    align-items:center;
    gap:1.2rem;
    border-radius:.9rem;
    overflow:hidden;
    text-align:left;
    background:#fff;
    border:.12rem solid rgba(122,85,38,.18);
  }
  .group__name{padding:.9rem 1.2rem;font-size:1.9rem;font-weight:900;}
  .group__desc{font-size:1.3rem;line-height:1.5;padding-right:1rem;color:var(--ink-2);}

  /* ---------- 任務 ---------- */
  .mission{width:100%;max-width:80rem;}
  .mission__icon{display:block;font-size:5rem;line-height:1.3;filter:drop-shadow(0 .3rem .5rem rgba(90,52,18,.22));}
  .mission__say{
    margin:1rem auto 0;
    max-width:56rem;
    padding:1.4rem 2rem;
    border-left:.4rem solid var(--flame);
    border-radius:.3rem 1rem 1rem .3rem;
    background:#fff;
    box-shadow:0 .3rem 0 rgba(90,52,18,.12);
    font-size:2.5rem;
    font-weight:900;
    line-height:1.5;
    text-align:left;
  }
  .timer{
    margin-top:1.6rem;
    font-size:5.5rem;
    font-weight:900;
    letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
    color:var(--teal);
  }
  .timer.low{color:var(--flame);}
  .timer.zero{color:var(--err);animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .timer small{display:block;font-size:1.1rem;font-weight:800;letter-spacing:.2em;color:var(--ink-2);opacity:.75;}

  .foods{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin:1.2rem 0 1rem;}
  .food{
    padding:.45rem 1.1rem;
    border-radius:.7rem;
    border:.12rem solid rgba(64,38,15,.28);
    box-shadow:0 .22rem 0 rgba(90,52,18,.18);
    font-size:1.7rem;
    font-weight:900;
    animation:pop .4s ease-out backwards;
  }
  .why{
    margin:.6rem auto 0;
    max-width:60rem;
    font-size:1.5rem;
    font-weight:800;
    color:var(--ink-2);
  }
  .effects{
    margin:1rem auto 0;
    max-width:74rem;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:.5rem;
    text-align:left;
    font-size:1.02rem;
    line-height:1.45;
  }
  .effects div{
    padding:.45rem .8rem;border-radius:.6rem;
    background:#fff;border:.1rem solid rgba(122,85,38,.16);
    color:var(--ink-2);
  }
  .effects b{color:var(--flame);}

  /* ---------- 三隻猴子 ---------- */
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;width:100%;max-width:80rem;margin-top:1.6rem;}
  .role{
    padding:1.5rem 1.2rem;border-radius:1.2rem;
    background:#fff;border:.14rem solid rgba(122,85,38,.2);
    box-shadow:0 .3rem 0 rgba(90,52,18,.12);
  }
  .role__e{font-size:4rem;line-height:1.3;}
  .role__n{font-size:1.9rem;font-weight:900;margin:.4rem 0 .5rem;color:var(--flame);}
  .role__r{font-size:1.25rem;line-height:1.55;color:var(--ink-2);}

  .term{
    font-size:9rem;
    font-weight:900;
    line-height:1.1;
    letter-spacing:.04em;
    background:linear-gradient(150deg,#F2A72C 0%,#E2621C 48%,#C4453B 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .12rem 0 rgba(255,255,255,.85));
    animation:pop .35s ease-out;
  }
  .term__n{font-size:1.2rem;letter-spacing:.3em;color:var(--ink-2);opacity:.8;font-weight:800;}
  .term--demo{background:linear-gradient(150deg,#7DBB3A 0%,#0E8C8F 60%,#12758F 100%);
    -webkit-background-clip:text;background-clip:text;}

  /* ---------- 引言 ---------- */
  .quote{
    margin:1.4rem auto 0;
    max-width:56rem;
    padding:1.8rem 2.4rem;
    border-left:.4rem solid var(--flame);
    border-radius:.3rem 1.2rem 1.2rem .3rem;
    background:#fff;
    box-shadow:0 .35rem 0 rgba(90,52,18,.12);
    font-size:2.15rem;
    font-weight:800;
    line-height:1.75;
    text-align:left;
    color:var(--ink);
  }
  .quote b{color:var(--flame);}
  .quote cite{
    display:block;
    margin-top:.9rem;
    font-style:normal;
    font-size:1.4rem;
    font-weight:900;
    text-align:right;
    color:var(--ink-2);
  }
  .quote cite::before{content:"—— ";}

  /* ---------- 照片牆 ---------- */
  /* 同一列等高、寬度照原始比例，所以每張照片都完整呈現，
     不裁切也不留黑邊。實際高度由 JS 依張數與比例算出來。 */
  .wall{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:center;
    gap:.7rem;
    width:100%;
    max-width:92rem;
    height:62vh;
    margin-top:.8rem;
  }
  .wall figure{
    flex:0 0 auto;
    margin:0;
    border:.28rem solid #fff;
    border-radius:.35rem;
    box-shadow:0 .3rem .8rem rgba(90,52,18,.28);
    background:var(--paper-2);
    line-height:0;
  }
  .wall figure:nth-child(odd){transform:rotate(-.6deg);}
  .wall figure:nth-child(even){transform:rotate(.6deg);}
  .wall img{display:block;height:100%;width:auto;}
  .wall--empty{
    display:block;height:auto;
    padding:2rem;text-align:center;
    font-size:1.4rem;color:var(--ink-2);
  }

  /* ---------- 大合照 ---------- */
  .count3{
    font-size:16rem;font-weight:900;line-height:1.2;
    background:linear-gradient(150deg,#F2A72C,#E2621C 50%,#C4453B);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pop .4s ease-out;
  }

  /* ---------- 結束卡 ---------- */
  .logos{display:flex;align-items:center;justify-content:center;gap:1.4rem;}
  .logos img{height:5rem;width:auto;display:block;}
  .logos img.mini{height:4.2rem;}

  /* 標題壓成一行，把高度留給右邊那張行事曆 */
  .endhead{display:flex;align-items:center;justify-content:center;gap:1.8rem;text-align:left;}
  .endhead .logos img{height:4.4rem;}
  .endhead .logos img.mini{height:3.6rem;}
  .endhead h1{margin:0;}
  .endhead p{margin:.2rem 0 0;font-size:1.35rem;font-weight:800;color:var(--ink-2);}

  /* 三塊各自分到一份寬度，圖片用 max-width/max-height 塞進自己的框，
     所以不管投影機是 1024 還是 1920，都不會爆版、也不會被裁 */
  .ends{
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:1.6rem;
    margin-top:.9rem;
    width:100%;
    height:66vh;
  }
  .end{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.5rem;
    min-height:0;
    min-width:0;
  }
  .end--qr{flex:0 0 16%;}
  .end--promo{flex:0 0 42%;}
  .end--cal{flex:0 0 30%;}

  .end__pic{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.28rem;
    background:#fff;
    border-radius:.5rem;
    box-shadow:0 .3rem .9rem rgba(90,52,18,.28);
  }
  .end__pic img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;}
  /* QR 不用撐滿整個高度，方形就好 */
  .end--qr .end__pic{flex:0 0 auto;align-self:center;}

  .end__title{flex:none;font-size:1.5rem;font-weight:900;color:var(--flame);}

  /* 固定三欄兩排，六張宣傳圖各自照原比例縮進格子裡 */
  .promo{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));
    gap:.55rem;
    width:100%;
    place-items:center;
  }
  .promo img{
    max-width:100%;
    max-height:100%;
    width:auto;height:auto;
    display:block;
    border:.2rem solid #fff;
    border-radius:.35rem;
    box-shadow:0 .2rem .55rem rgba(90,52,18,.24);
  }
  /* ---------- 影片 ---------- */
  .video{position:fixed;inset:0;z-index:2;background:#000;display:grid;place-items:center;}
  .video video{width:100%;height:100%;object-fit:contain;background:#000;}

  /* ---------- 控制列 ---------- */
  .bar-ui{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:5;
    display:flex;
    align-items:center;
    gap:.75rem;
    padding:.55rem 1rem;
    background:rgba(255,251,240,.96);
    border-top:.1rem solid rgba(122,85,38,.25);
    box-shadow:0 -.3rem .8rem rgba(90,52,18,.12);
    color:var(--ink);
    font-size:.95rem;
    opacity:0;
    transform:translateY(110%);
    transition:opacity .25s ease, transform .25s ease;
  }
  body.show-ui .bar-ui{opacity:1;transform:none;}
  .bar-ui button{
    font-family:inherit;
    font-size:.95rem;
    font-weight:900;
    padding:.35rem .9rem;
    border-radius:.55rem;
    border:.1rem solid rgba(122,85,38,.3);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .bar-ui button:hover{background:var(--paper-2);border-color:var(--flame);}
  .bar-ui .grow{flex:1;text-align:center;color:var(--ink-2);}
  .bar-ui kbd{
    font:inherit;font-size:.8rem;padding:0 .3rem;border-radius:.25rem;
    background:var(--paper-2);border:.06rem solid rgba(122,85,38,.3);
  }
  .net{font-weight:900;}
  .net.on{color:var(--teal);}
  .net.off{color:var(--err);}

  /* ---------- 跳關選單 ---------- */
  .menu{
    position:fixed;inset:0;z-index:6;
    background:rgba(253,242,216,.98);
    padding:2.5rem;
    overflow:auto;
    color:var(--ink);
  }
  .menu h2{margin:0 0 1rem;font-size:1.8rem;color:var(--flame);}
  .menu ol{list-style:none;margin:0;padding:0;columns:3;column-gap:1.5rem;}
  .menu li{break-inside:avoid;margin-bottom:.3rem;}
  .menu button{
    width:100%;
    text-align:left;
    font-family:inherit;
    font-size:1.02rem;
    padding:.35rem .7rem;
    border-radius:.5rem;
    border:none;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .menu button:hover{background:#fff;}
  .menu button.now{background:var(--flame);color:#fff;font-weight:900;}
  .menu .part{margin-top:.8rem;font-size:.9rem;letter-spacing:.2em;color:var(--flame);font-weight:900;}
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <path d="M120 780 C 380 700, 300 500, 560 470 S 900 520, 1010 360 S 1280 250, 1470 150"
          fill="none" stroke="#8C3A1E" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="26 26"/>
    <g transform="translate(1330 720)" stroke="#5A3412" fill="none" stroke-width="5">
      <circle r="130"/><circle r="104"/>
      <path d="M0 -150 L26 -26 L150 0 L26 26 L0 150 L-26 26 L-150 0 L-26 -26 Z" fill="#8C3A1E" stroke="none"/>
      <path d="M0 -120 L0 120 M-120 0 L120 0" stroke-width="3"/>
    </g>
    <g transform="translate(200 190)" stroke="#B0362C" stroke-width="16" stroke-linecap="round">
      <path d="M-46 -46 L46 46 M46 -46 L-46 46"/>
    </g>
  </svg>
</div>

<div class="rail">
  <span class="rail__room" id="railroom"></span>
  <span class="rail__keys" id="railkeys"></span>
</div>

<main class="screen" id="screen"></main>

<div class="bar-ui">
  <button type="button" data-go="-1">← 上一步</button>
  <button type="button" data-go="1">下一步 →</button>
  <button type="button" id="b-menu">跳關 (Esc)</button>
  <button type="button" id="b-full">全螢幕 (F)</button>
  <button type="button" id="b-mute">🔊 音樂 (M)</button>
  <span class="grow" id="barinfo"></span>
  <span class="net" id="netinfo">連線中…</span>
</div>

<div class="menu" id="menu" hidden>
  <h2>跳到哪一關？（Esc 關閉）</h2>
  <ol id="menulist"></ol>
</div>

<script src="assets/settings.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/quiz-data.js"></script>
<script src="assets/cards-data.js"></script>
<script src="assets/monkeys-data.js"></script>
<script src="assets/photos-data.js"></script>
<script src="assets/net.js"></script>
<script>
(function () {
  "use strict";

  var QUIZ = window.CDVC_QUIZ;
  var CARDS = window.CDVC_CARDS;
  var MONKEY = window.CDVC_MONKEYS;
  var NET = window.CDVC_NET;
  var QR = window.CDVC_QR;

  var $ = function (id) { return document.getElementById(id); };
  var KEYS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ============================================================
     劇情：認識自己 → 找到同伴 → 實踐服務 → 發現寶藏就在自己身上
     流程是一維陣列，主持人一直按右鍵就會走完
     ============================================================ */
  var PARTS = {
    intro: { name: "序章・藏寶圖" },
    q1: { name: "第一關・認識自己", key: "🧭" },
    q2: { name: "第二關・找到同伴", key: "🍲" },
    q3: { name: "第三關・實踐服務", key: "🤝" },
    q4: { name: "第四關・開寶箱", key: "💎" },
    end: { name: "終章・啟航" }
  };

  var S = [];
  function add(o) { S.push(o); }

  add({ part: "intro", kind: "cover", label: "封面・QR code" });
  add({ part: "intro", kind: "rules", label: "序章：四段旅程" });

  add({ part: "q1", kind: "partTitle", label: "第一關 標題・認識自己" });
  QUIZ.QUESTIONS.forEach(function (q, i) {
    add({ part: "q1", kind: "question", qi: i, sub: "answer", label: "Q" + (i + 1) + "　" + q.q });
    add({ part: "q1", kind: "question", qi: i, sub: "stats", label: "Q" + (i + 1) + " 統計" });
  });
  add({ part: "q1", kind: "map", label: "★ 四象限地圖" });
  QUIZ.ORDER.forEach(function (k) {
    add({ part: "q1", kind: "persona", pkey: k, label: "人格　" + QUIZ.TYPES[k].name });
  });
  add({ part: "q1", kind: "key", n: 1, label: "🧭 第一段旅程完成" });

  add({ part: "q2", kind: "partTitle", label: "第二關 標題・找到同伴" });
  add({ part: "q2", kind: "groups", label: "六大類熱身" });
  CARDS.MISSIONS.forEach(function (m, i) {
    add({ part: "q2", kind: "mission", mi: i, sub: "ask", label: m.title });
    add({ part: "q2", kind: "mission", mi: i, sub: "reveal", label: "└ 公布解答" });
  });
  add({ part: "q2", kind: "finalMission", label: "終極任務・為一個人做一餐" });
  add({ part: "q2", kind: "key", n: 2, label: "🍲 第二段旅程完成" });
  add({ part: "q2", kind: "photos", set: "kitchen", label: "★ 開伙的樣子" });

  add({ part: "q3", kind: "partTitle", label: "第三關 標題・實踐服務" });
  add({ part: "q3", kind: "monkeyRules", label: "三隻猴子 規則" });
  add({ part: "q3", kind: "monkeyPlay", label: "★ 三隻猴子 出題" });
  add({ part: "q3", kind: "key", n: 3, label: "🤝 第三段旅程完成" });
  add({ part: "q3", kind: "photos", set: "service", label: "★ 志工照片牆" });
  add({ part: "q3", kind: "photos", set: "relief", label: "★ 賑災現場" });
  add({ part: "q3", kind: "photos", set: "global", label: "★ 海外義診交流" });

  add({ part: "q4", kind: "partTitle", label: "第四關 標題・開寶箱" });
  add({ part: "q4", kind: "photo", label: "★ 大合照" });
  add({ part: "q4", kind: "key", n: 4, label: "💎 箱子打開了" });

  add({ part: "end", kind: "finale", label: "終章：寶藏就在你身上" });
  add({ part: "end", kind: "video", label: "▶ 法船影片" });
  add({ part: "end", kind: "outro", label: "結束卡", music: "media/崇德禮讚.mp3" });

  /* ============================================================
     狀態
     ============================================================ */
  var i = 0;                    // 目前畫面
  var players = {};             // 從連線層來的
  var timer = { left: 0, total: 0, running: false };
  var deck = MONKEY.deck();
  var termAt = 0;
  var photoCount = 0;

  /** 已經走過的關卡收集到幾段旅程 */
  function keysWon() {
    var won = {};
    for (var n = 0; n <= i; n++) {
      if (S[n].kind === "key") { won[S[n].n] = true; }
    }
    return won;
  }

  function roster() {
    return Object.keys(players).map(function (id) {
      var p = players[id] || {};
      return { id: id, name: p.name, answers: p.answers || {} };
    }).filter(function (p) { return p.name; });
  }

  function answeredCount(qi) {
    return roster().filter(function (p) {
      return p.answers[qi] !== undefined && p.answers[qi] !== null;
    }).length;
  }

  /* ============================================================
     畫面
     ============================================================ */
  function render() {
    var sc = S[i];
    var el = $("screen");
    el.className = "screen" + (sc.kind === "outro" ? " screen--tight" : "");

    // 影片離開時要停掉，不然聲音會跟著下一頁
    var oldVideo = el.querySelector("video");
    if (oldVideo) { oldVideo.pause(); }

    el.innerHTML = VIEWS[sc.kind] ? VIEWS[sc.kind](sc) : "";
    if (AFTER[sc.kind]) { AFTER[sc.kind](sc, el); }

    renderRail();
    renderBar();
    tune(sc);
    broadcast();
  }

  function renderRail() {
    $("railroom").textContent = "房號 " + NET.room;
    var won = keysWon();
    $("railkeys").innerHTML = [1, 2, 3, 4].map(function (n) {
      var part = ["", "q1", "q2", "q3", "q4"][n];
      return '<span class="rail__key' + (won[n] ? " on" : "") + '">' + PARTS[part].key + "</span>";
    }).join("");
  }

  function renderBar() {
    var sc = S[i];
    var extra = "";
    if (sc.kind === "monkeyPlay") { extra = '　<kbd>→</kbd> 下一題　<kbd>Shift</kbd>+<kbd>→</kbd> 結束這關'; }
    else if (sc.kind === "mission" && sc.sub === "ask") { extra = '　<kbd>T</kbd> 計時開始/暫停　<kbd>R</kbd> 重設'; }
    else if (sc.kind === "photo") { extra = '　<kbd>T</kbd> 開始 3・2・1'; }

    $("barinfo").innerHTML =
      esc(PARTS[sc.part].name) + "　·　" + esc(sc.label) +
      "　(" + (i + 1) + "/" + S.length + ")" + extra;
  }

  /* ---------- 各畫面 ---------- */
  var VIEWS = {};
  var AFTER = {};

  VIEWS.cover = function () {
    return '' +
      '<div class="cover">' +
        '<div>' +
          '<div class="logos" style="justify-content:flex-start;margin-bottom:1rem">' +
            '<img src="assets/logo1.webp" alt="崇德志工社">' +
            '<img class="mini" src="assets/logo2.webp" alt="崇德志工社">' +
          "</div>" +
          '<p class="eyebrow">台科大天心伙食團 迎新</p>' +
          '<h1 class="huge">尋寶啟航</h1>' +
          '<p class="lede">傳說島上藏著一個寶藏。<br>讓我們踏上冒險一起尋找它吧！</p>' +
          '<div class="crew">' +
            '<div class="crew__count"><span id="cnt">0</span> 位夥伴上船了</div>' +
            '<div class="crew__names" id="names"></div>' +
          '</div>' +
        '</div>' +
        '<div class="cover__qr">' +
          '<div class="qr" id="qr"></div>' +
          '<p class="cover__scan">SCAN ME</p>' +
          '<p class="cover__url">' + esc(NET.playUrl()) + '</p>' +
        '</div>' +
      '</div>';
  };

  AFTER.cover = function () {
    try {
      $("qr").innerHTML = QR.svg(NET.playUrl(), { dark: "#40260F" });
    } catch (e) {
      $("qr").innerHTML = '<p style="color:#333;padding:1rem">QR 產生失敗，請直接念網址</p>';
    }
    paintCrew();
  };

  function paintCrew() {
    var cnt = $("cnt");
    if (!cnt) { return; }
    var list = roster();
    cnt.textContent = list.length;
    $("names").innerHTML = list.slice(-48).map(function (p) {
      return '<span class="chip">' + esc(p.name) + "</span>";
    }).join("");
  }

  var BEATS = [
    ["🧭", "認識自己", "第一段"],
    ["🍲", "找到同伴", "第二段"],
    ["🤝", "實踐服務", "第三段"],
    ["💎", "發現寶藏", "終　點"]
  ];

  VIEWS.rules = function () {
    return '' +
      '<p class="eyebrow">序章・藏寶圖</p>' +
      '<h1 class="huge">四段旅程</h1>' +
      '<div class="beats">' +
        BEATS.map(function (b, n) {
          return (n ? '<span class="beat__arrow">→</span>' : "") +
            '<div class="beat"><b>' + b[0] + "</b>" +
            "<span>" + esc(b[1]) + "</span>" +
            "<i>" + esc(b[2]) + "</i></div>";
        }).join("") +
      "</div>" +
      '<p class="lede">經歷這四場蛻變，你將獲得打開寶箱的<b>鑰匙</b>。</p>';
  };

  VIEWS.partTitle = function (sc) {
    var meta = {
      q1: ["🧭", "第一段旅程", "認識自己",
           "藏寶圖的第一條線索，是你自己。<br>知道你是誰，才知道要往哪裡走。"],
      q2: ["🍲", "第二段旅程", "找到同伴",
           "一人在外不知道怎麼吃才會營養？<br>走進伙食團，就有熱騰騰的飯菜，<br>還有陪你一起成長的夥伴！"],
      q3: ["🤝", "第三段旅程", "實踐服務",
           "行萬里路，勝讀萬卷書。<br>一起上山下海出隊的崇德志工社。"],
      q4: ["💎", "終　　點", "開寶箱",
           "四段旅程走完了。<br>把箱子打開之前，讓我們．．．"]
    }[sc.part];
    return '' +
      '<span class="emoji">' + meta[0] + "</span>" +
      '<p class="eyebrow">' + meta[1] + "</p>" +
      '<h1 class="huge">' + meta[2] + "</h1>" +
      '<p class="lede">' + meta[3] + "</p>";
  };

  VIEWS.question = function (sc) {
    var q = QUIZ.QUESTIONS[sc.qi];
    if (sc.sub === "answer") {
      var wide = q.opts.length <= 4;
      return '' +
        '<div class="q">' +
          '<p class="q__num">第 ' + (sc.qi + 1) + " 題 / 共 " + QUIZ.QUESTIONS.length + " 題" +
            (q.multi ? "　·　可複選" : "") + "</p>" +
          '<h1 class="q__title">' + esc(q.q) + "</h1>" +
          '<ul class="q__opts' + (wide ? " one" : "") + '">' +
            q.opts.map(function (o, n) {
              return '<li class="q__opt"><span class="q__key">' + KEYS.charAt(n) + "</span>" +
                     "<span>" + esc(o.t) + "</span></li>";
            }).join("") +
          "</ul>" +
          '<p class="q__done">已作答 <b id="ans">0</b> <span class="quiet">/ <span id="tot">0</span> 人</span></p>' +
        "</div>";
    }

    // 統計
    var list = roster();
    var counts = q.opts.map(function () { return 0; });
    list.forEach(function (p) {
      QUIZ.asList(p.answers[sc.qi]).forEach(function (ci) {
        if (counts[ci] !== undefined) { counts[ci]++; }
      });
    });
    var max = Math.max.apply(null, counts.concat([1]));

    return '' +
      '<p class="eyebrow">第 ' + (sc.qi + 1) + " 題　大家怎麼選</p>" +
      '<h2 class="mid" style="margin-bottom:1.5rem">' + esc(q.q) + "</h2>" +
      '<ul class="bars">' +
        q.opts.map(function (o, n) {
          var pct = Math.round(counts[n] / max * 100);
          return '<li class="bar">' +
            '<span class="bar__key">' + KEYS.charAt(n) + "</span>" +
            '<span class="bar__track"><span class="bar__fill" data-w="' + pct + '"></span>' +
              '<span class="bar__label"><span>' + esc(o.t) + "</span></span></span>" +
            '<span class="bar__n">' + counts[n] + "</span>" +
          "</li>";
        }).join("") +
      "</ul>";
  };

  AFTER.question = function (sc, el) {
    if (sc.sub === "answer") { paintAnswered(sc.qi); return; }
    // 長條要在下一個影格才長出來，動畫才看得到
    requestAnimationFrame(function () {
      Array.prototype.forEach.call(el.querySelectorAll(".bar__fill"), function (f) {
        f.style.width = f.getAttribute("data-w") + "%";
      });
    });
  };

  function paintAnswered(qi) {
    var a = $("ans"), t = $("tot");
    if (!a) { return; }
    a.textContent = answeredCount(qi);
    t.textContent = roster().length;
  }

  /* ---------- 四象限地圖 ---------- */
  VIEWS.map = function () {
    var qs = QUIZ.QUADRANTS.map(function (q) {
      return '<div class="map__q ' + q.at + '"><b style="color:' + q.color + '">' +
             esc(q.title) + "</b><i>" + esc(q.sub) + "</i></div>";
    }).join("");

    return '' +
      '<p class="eyebrow">大家的羅盤</p>' +
      '<div class="map" id="map">' +
        '<div class="map__grid"></div>' +
        '<div class="map__axis h"></div><div class="map__axis v"></div>' +
        qs +
        '<span class="map__ax up">人際導向</span>' +
        '<span class="map__ax down">任務導向</span>' +
        '<span class="map__ax left">被動內向</span>' +
        '<span class="map__ax right">主動外向</span>' +
      "</div>" +
      '<div class="legend">' +
        QUIZ.ORDER.map(function (k) {
          var t = QUIZ.TYPES[k];
          return '<i style="color:' + t.color + '">' + t.emoji + " " + esc(t.name) + "</i>";
        }).join("") +
      "</div>";
  };

  AFTER.map = function (sc, el) {
    var box = el.querySelector("#map");
    var pts = roster().map(function (p) {
      var pos = QUIZ.position(p.answers);
      if (!pos) { return null; }
      return { name: p.name, type: QUIZ.typeOf(p.answers), x: pos.x, y: pos.y };
    }).filter(Boolean);

    if (!pts.length) {
      box.insertAdjacentHTML("beforeend",
        '<p class="quiet" style="position:absolute;inset:auto 0 45% 0;font-size:1.6rem">還沒有人作答</p>');
      return;
    }

    var W = box.clientWidth, H = box.clientHeight;
    var BASE = 1.7;      // rem，人不多時的名牌字級
    box.style.setProperty("--dot-size", BASE + "rem");

    // 先照人格座標放上去
    var items = pts.map(function (p, n) {
      var t = QUIZ.TYPES[p.type];
      var span = document.createElement("span");
      span.className = "dot";
      span.style.color = t.color;
      span.style.animationDelay = (n * 0.04).toFixed(2) + "s";
      span.innerHTML = t.emoji + "<span>" + esc(p.name) + "</span>";
      box.appendChild(span);
      return {
        el: span,
        x: (p.x + 1) / 2 * W + (Math.random() - 0.5) * 3,
        y: (1 - p.y) / 2 * H + (Math.random() - 0.5) * 3
      };
    });

    /* 量真實寬高。用 offsetWidth 而不是 getBoundingClientRect，
       因為進場動畫有 scale，量到的會是縮小後的尺寸。 */
    function measure() {
      items.forEach(function (it) {
        it.w = it.el.offsetWidth;
        it.h = it.el.offsetHeight;
      });
    }
    measure();

    /* 名牌總面積不能佔地圖太多，不然怎麼推都會疊到。
       超過就整批縮小再量一次——名字長短不同，用算的比寫死級距準。 */
    var used = 0;
    items.forEach(function (it) { used += (it.w + 10) * (it.h + 7); });
    var room = 0.3 * W * H;
    if (used > room) {
      var k = Math.max(0.5, Math.sqrt(room / used));
      box.style.setProperty("--dot-size", (BASE * k).toFixed(2) + "rem");
      measure();
    }

    /* 一次掃完所有重疊、把位移累加起來再一起套用（並且加阻尼），
       比邊掃邊移穩定很多，不然後面的推擠會把前面的成果推回去。 */
    /* 四角的象限說明框與座標軸文字是固定的，把它們當成推不動的障礙物，
       名牌只會被推開、不會壓到上面的字 */
    var mapBox = box.getBoundingClientRect();
    var walls = Array.prototype.map.call(
      box.querySelectorAll(".map__q, .map__ax"),
      function (w) {
        var r = w.getBoundingClientRect();
        return {
          x: r.left - mapBox.left + r.width / 2,
          y: r.top - mapBox.top + r.height / 2,
          w: r.width,
          h: r.height
        };
      });

    var padX = 8, padY = 5;
    var dxs = new Array(items.length);
    var dys = new Array(items.length);

    for (var iter = 0; iter < 400; iter++) {
      var hit = false;
      for (var z = 0; z < items.length; z++) { dxs[z] = 0; dys[z] = 0; }

      for (var a = 0; a < items.length; a++) {
        for (var b = a + 1; b < items.length; b++) {
          var A = items[a], B = items[b];
          var dx = B.x - A.x, dy = B.y - A.y;
          var ox = (A.w + B.w) / 2 + padX - Math.abs(dx);
          var oy = (A.h + B.h) / 2 + padY - Math.abs(dy);
          if (ox <= 0 || oy <= 0) { continue; }
          hit = true;

          // 往比較好推的那個方向分開，通常是上下
          if (oy <= ox) {
            var sy = (dy >= 0 ? 1 : -1) * oy / 2;
            dys[a] -= sy; dys[b] += sy;
          } else {
            var sx = (dx >= 0 ? 1 : -1) * ox / 2;
            dxs[a] -= sx; dxs[b] += sx;
          }
        }
      }

      // 障礙物只推別人、自己不動
      for (var wi = 0; wi < walls.length; wi++) {
        for (var ii = 0; ii < items.length; ii++) {
          var It = items[ii], Wl = walls[wi];
          var wdx = It.x - Wl.x, wdy = It.y - Wl.y;
          var wox = (It.w + Wl.w) / 2 + padX - Math.abs(wdx);
          var woy = (It.h + Wl.h) / 2 + padY - Math.abs(wdy);
          if (wox <= 0 || woy <= 0) { continue; }
          hit = true;
          if (woy <= wox) { dys[ii] += (wdy >= 0 ? 1 : -1) * woy; }
          else { dxs[ii] += (wdx >= 0 ? 1 : -1) * wox; }
        }
      }

      if (!hit) { break; }

      for (var c = 0; c < items.length; c++) {
        var it = items[c];
        it.x = Math.max(it.w / 2 + 3, Math.min(W - it.w / 2 - 3, it.x + dxs[c] * 0.55));
        it.y = Math.max(it.h / 2 + 3, Math.min(H - it.h / 2 - 3, it.y + dys[c] * 0.55));
      }
    }
    items.forEach(function (it) {
      it.el.style.left = it.x.toFixed(1) + "px";
      it.el.style.top = it.y.toFixed(1) + "px";
    });
  };

  AFTER.photos = function (sc, el) {
    var wall = el.querySelector("#wall");
    if (!wall) { return; }

    var figs = Array.prototype.slice.call(wall.querySelectorAll("figure"));
    var pending = figs.length;

    function done() { if (--pending <= 0) { layout(); } }

    figs.forEach(function (fig) {
      var img = fig.querySelector("img");
      if (img.complete && img.naturalWidth) { done(); return; }
      img.addEventListener("load", done);
      img.addEventListener("error", function () {
        // 檔案還沒放進去就把那一格收掉，不要留破圖
        if (fig.parentNode) { fig.parentNode.removeChild(fig); }
        done();
      });
    });

    /**
     * 等高排版：同一列的照片高度一樣、寬度照原始比例，
     * 二分搜出「排得下的最大高度」，照片就會剛好鋪滿又不被裁到。
     */
    function layout() {
      var live = Array.prototype.slice.call(wall.querySelectorAll("figure"));
      if (!live.length) {
        wall.className = "wall wall--empty";
        wall.textContent = "照片還沒放進 media/photos/";
        return;
      }

      var W = wall.clientWidth, H = wall.clientHeight;
      var cs = getComputedStyle(live[0]);
      var frame = parseFloat(cs.borderLeftWidth) * 2;
      var gap = parseFloat(getComputedStyle(wall).columnGap) || 10;

      var shots = live.map(function (fig) {
        var img = fig.querySelector("img");
        var a = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1.5;
        return { el: fig, img: img, a: a };
      });

      // 某個高度會排成幾列
      function rowsAt(h) {
        var rows = 1, used = 0;
        for (var i = 0; i < shots.length; i++) {
          var w = shots[i].a * h + frame;
          if (used > 0 && used + gap + w > W) { rows++; used = w; }
          else { used = used ? used + gap + w : w; }
        }
        return rows;
      }

      var lo = 40, hi = H, best = 40;
      for (var n = 0; n < 40; n++) {
        var mid = (lo + hi) / 2;
        var r = rowsAt(mid);
        if (r * (mid + frame) + (r - 1) * gap <= H) { best = mid; lo = mid; }
        else { hi = mid; }
      }

      shots.forEach(function (sh) { sh.img.style.height = Math.floor(best) + "px"; });
    }

    if (!pending) { layout(); }
  };

  /* ============================================================
     配樂

     一關一首，跨關的時候淡出淡入。音量壓在 0.3 左右，
     主持人講話蓋得過去。瀏覽器規定要先有互動才能播，
     所以第一次是在主持人按下第一個鍵之後才會出聲。
     ============================================================ */
  var MUSIC = {
    q1: "assets/quiz.mp3",
    q2: "assets/cook.mp3",
    q3: "assets/volunteer.mp3",
    q4: "assets/volunteer.mp3"   // 開寶箱與大合照接著上一關的曲子
    // 終章預設靜音，結束卡那一頁由畫面自己指定曲子（見流程裡的 music）
  };

  var VOLUME = 0.3;
  var tracks = {};
  var nowPlaying = null;
  var nowSrc = "";
  var muted = false;

  function fadeTo(el, to, ms, done) {
    clearInterval(el.fadeTimer);
    var from = el.volume, t0 = Date.now();
    el.fadeTimer = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / ms);
      el.volume = Math.max(0, Math.min(1, from + (to - from) * k));
      if (k >= 1) {
        clearInterval(el.fadeTimer);
        if (done) { done(); }
      }
    }, 40);
  }

  /** 這個畫面該放什麼：畫面自己有指定就用它的，否則看這一關的 */
  function trackFor(sc) {
    if (sc.music !== undefined) { return sc.music || ""; }
    return MUSIC[sc.part] || "";
  }

  /** 切到這個畫面該放的曲子 */
  function tune(sc) {
    var src = muted ? "" : trackFor(sc);
    if (src === nowSrc) { return; }

    if (nowPlaying) {
      var old = nowPlaying;
      fadeTo(old, 0, 700, function () { old.pause(); });
    }

    nowSrc = src;
    paintMute();
    if (!src) { nowPlaying = null; return; }

    if (!tracks[src]) {
      var a = new Audio(src);
      a.loop = true;
      a.preload = "auto";
      a.volume = 0;
      tracks[src] = a;
    }

    nowPlaying = tracks[src];
    nowPlaying.volume = 0;
    nowPlaying.play()["catch"](function () {
      /* 還沒有互動就被擋掉，下一次按鍵會再試一次 */
    });
    fadeTo(nowPlaying, VOLUME, 900);
  }

  /** 被瀏覽器擋掉的話，主持人一按鍵就補播 */
  function nudgeMusic() {
    if (nowPlaying && nowPlaying.paused && !muted) {
      nowPlaying.play()["catch"](function () {});
      fadeTo(nowPlaying, VOLUME, 600);
    }
  }

  function paintMute() {
    var b = $("b-mute");
    var name = nowSrc ? nowSrc.split("/").pop() : "無";
    b.textContent = (muted ? "🔇" : "🔊") + " 音樂 (M)";
    b.title = muted ? "已靜音" : ("目前播放：" + name);
  }

  function toggleMute() {
    muted = !muted;
    if (muted) {
      if (nowPlaying) {
        var old = nowPlaying;
        fadeTo(old, 0, 400, function () { old.pause(); });
      }
      nowPlaying = null;
      nowSrc = "";
    } else {
      tune(S[i]);
    }
    paintMute();
  }

  /* ============================================================
     計時器
     ============================================================ */
  function startTimer(sec) {
    timer.total = sec;
    timer.left = sec;
    timer.running = true;
    paintTimer();
  }

  function paintTimer() {
    var el = $("clock");
    if (!el) { return; }
    var m = Math.floor(timer.left / 60), s = timer.left % 60;
    el.className = "timer" + (timer.left === 0 ? " zero" : (timer.left <= 15 ? " low" : ""));
    el.innerHTML = m + ":" + (s < 10 ? "0" : "") + s +
      "<small>" + (timer.left === 0 ? "時間到" : (timer.running ? "討論時間" : "暫停中")) + "</small>";
  }

  setInterval(function () {
    if (!timer.running || timer.left <= 0) { return; }
    timer.left--;
    if (timer.left === 0) { timer.running = false; }
    paintTimer();
  }, 1000);

  /* ============================================================
     操作
     ============================================================ */
  function go(delta) {
    var next = i + delta;
    if (next < 0 || next >= S.length) { return; }
    i = next;
    render();
  }

  function jump(n) {
    i = Math.max(0, Math.min(S.length - 1, n));
    render();
  }

  function broadcast() {
    var sc = S[i];
    NET.setState({
      i: i,
      part: sc.part,
      kind: sc.kind,
      label: sc.label,
      qi: sc.qi === undefined ? null : sc.qi,
      sub: sc.sub || null,
      mi: sc.mi === undefined ? null : sc.mi,
      pkey: sc.pkey || null,
      set: sc.set || null,
      term: sc.kind === "monkeyPlay" ? deck[termAt].t : null,
      total: S.length
    });
  }

  document.addEventListener("keydown", function (e) {
    var sc = S[i];
    nudgeMusic();

    if (e.key === "Escape") {
      e.preventDefault();
      toggleMenu();
      return;
    }
    if (!$("menu").hidden) { return; }

    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") {
      e.preventDefault();
      // 三隻猴子停在同一頁換題，Shift 才離開
      if (sc.kind === "monkeyPlay" && !e.shiftKey) {
        if (termAt < deck.length - 1) { termAt++; render(); }
        return;
      }
      go(1);
      return;
    }

    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      if (sc.kind === "monkeyPlay" && !e.shiftKey && termAt > 0) {
        termAt--;
        render();
        return;
      }
      go(-1);
      return;
    }

    var k = e.key.toLowerCase();

    if (k === "f") { toggleFull(); return; }

    if (k === "m") { toggleMute(); return; }

    if (k === "t") {
      if (sc.kind === "photo") { runPhotoCountdown(); return; }
      if (timer.left > 0) { timer.running = !timer.running; paintTimer(); }
      else if (sc.kind === "mission" && sc.sub === "ask") { startTimer(90); }
      return;
    }

    if (k === "r") {
      if (sc.kind === "mission" && sc.sub === "ask") { startTimer(90); }
      if (sc.kind === "monkeyPlay") { termAt = 0; render(); }
      if (sc.kind === "photo") { photoCount = 0; render(); }
      return;
    }
  });

  function runPhotoCountdown() {
    if (photoCount) { return; }
    var seq = [3, 2, 1, 4];   // 4 是快門那一格
    var at = 0;
    (function step() {
      photoCount = seq[at];
      render();
      at++;
      if (at < seq.length) { setTimeout(step, 1000); }
      else { setTimeout(function () { photoCount = 0; render(); }, 2500); }
    })();
  }

  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen()["catch"](function () {}); }
  }

  function toggleMenu() {
    var m = $("menu");
    if (m.hidden) { buildMenu(); m.hidden = false; }
    else { m.hidden = true; }
  }

  function buildMenu() {
    var lastPart = "";
    $("menulist").innerHTML = S.map(function (sc, n) {
      var head = "";
      if (sc.part !== lastPart) {
        lastPart = sc.part;
        head = '<li class="part">' + esc(PARTS[sc.part].name) + "</li>";
      }
      return head + '<li><button type="button" data-jump="' + n + '"' +
        (n === i ? ' class="now"' : "") + ">" + (n + 1) + ". " + esc(sc.label) + "</button></li>";
    }).join("");
  }

  $("menu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-jump]");
    if (!b) { return; }
    $("menu").hidden = true;
    jump(Number(b.getAttribute("data-jump")));
  });

  document.querySelector(".bar-ui").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    if (b.hasAttribute("data-go")) { go(Number(b.getAttribute("data-go"))); }
    if (b.id === "b-menu") { toggleMenu(); }
    if (b.id === "b-full") { toggleFull(); }
    if (b.id === "b-mute") { toggleMute(); }
    nudgeMusic();
  });

  /* 滑鼠不動就把控制列收起來，投影幕上乾淨一點 */
  var hideAt = null;
  function poke() {
    document.body.classList.add("show-ui");
    clearTimeout(hideAt);
    hideAt = setTimeout(function () {
      document.body.classList.remove("show-ui");
    }, 3000);
  }
  document.addEventListener("mousemove", poke);
  poke();
  paintMute();

  /* ============================================================
     連線
     ============================================================ */
  NET.onStatus = function (ok) {
    var el = $("netinfo");
    el.className = "net " + (ok ? "on" : "off");
    el.textContent = ok ? "● 已連線" : "● 連線中斷，檢查網路";
  };

  NET.init("stage").then(function (r) {
    var el = $("netinfo");
    el.className = "net off";
    el.textContent = (r.mode === "firebase")
      ? "● 連線中…"
      : "● 本機模式：找不到 Firebase 設定（鍵盤照常可用）";
    broadcast();
  });

  NET.onPlayers(function (p) {
    players = p || {};
    var sc = S[i];
    // 只重畫會變的部分，不要整頁重刷，不然動畫會一直重跑
    if (sc.kind === "cover") { paintCrew(); }
    else if (sc.kind === "question" && sc.sub === "answer") { paintAnswered(sc.qi); }
  });

  render();
})();
</script>
</body>
</html>
