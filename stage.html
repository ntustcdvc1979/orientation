<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尋寶啟航｜投影幕 - 台科大崇德志工社迎新</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo1.webp">
<link rel="stylesheet" href="assets/theme.css">
<style>
  /* 字級跟著視窗走，投影機不管是 1024 還是 1920 都塞得剛好 */
  html{font-size:clamp(13px, 0.62vw + 0.62vh, 30px);}

  /* 藏寶圖：暖黃的舊紙，配上金、火橘、海水青 */
  body{
    background:var(--paper);
    color:var(--ink);
    height:100vh;
    overflow:hidden;
    cursor:none;
  }
  body.show-ui{cursor:default;}

  /* 底色的光暈與紙紋 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(85rem 55rem at 6% -12%, rgba(233,163,23,.42), transparent 60%),
      radial-gradient(75rem 52rem at 98% 2%, rgba(14,140,143,.26), transparent 58%),
      radial-gradient(85rem 60rem at 52% 122%, rgba(226,98,28,.30), transparent 60%),
      repeating-linear-gradient(48deg, rgba(122,85,38,.05) 0 2px, transparent 2px 10px);
  }

  /* 舊紙的四邊燒灼感，讓亮底不會刺眼 */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    box-shadow:inset 0 0 16rem rgba(90,52,18,.34);
  }

  /* 裝飾層：羅盤、航線、藏寶點 */
  .deco{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:.13;
  }
  .deco svg{width:100%;height:100%;}

  /* ---------- 版面骨架 ---------- */
  .rail{
    position:fixed;
    top:0; left:0; right:0;
    z-index:3;
    display:flex;
    align-items:center;
    gap:1rem;
    padding:1rem 2rem;
    font-size:1rem;
  }
  .rail__room{
    font-weight:900;
    letter-spacing:.12em;
    color:var(--ink-2);
  }
  .rail__keys{display:flex;gap:.55rem;margin-left:auto;}
  .rail__key{
    width:2.7rem;height:2.7rem;
    display:grid;place-items:center;
    border-radius:50%;
    border:.14rem solid rgba(122,85,38,.28);
    background:rgba(255,255,255,.55);
    font-size:1.3rem;
    filter:grayscale(1);
    opacity:.4;
    transition:all .5s ease;
  }
  .rail__key.on{
    filter:none;
    opacity:1;
    border-color:var(--flame);
    background:#fff;
    box-shadow:0 0 0 .22rem rgba(242,167,44,.35), 0 .3rem .8rem rgba(90,52,18,.18);
  }

  main.screen{
    position:relative;
    z-index:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:4.5rem 3.5rem 4rem;
    text-align:center;
  }

  /* ---------- 共用零件 ---------- */
  .eyebrow{
    margin:0 0 .6rem;
    font-size:1.15rem;
    font-weight:900;
    letter-spacing:.34em;
    color:var(--flame);
  }
  .huge{
    margin:0;
    font-size:5.2rem;
    font-weight:900;
    line-height:1.12;
    letter-spacing:.02em;
    background:linear-gradient(150deg,#F2A72C 0%,#E2621C 48%,#C4453B 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 .12rem 0 rgba(255,255,255,.85));
  }
  .big{margin:0;font-size:3.4rem;font-weight:900;line-height:1.25;}
  .mid{margin:0;font-size:2.1rem;font-weight:800;line-height:1.45;}
  .lede{
    margin:1.2rem auto 0;
    max-width:52rem;
    font-size:1.6rem;
    line-height:1.7;
    color:var(--ink-2);
  }
  .lede b{color:var(--flame);}
  .quiet{color:var(--ink-2);opacity:.8;}
  .emoji{display:block;font-size:6rem;line-height:1.1;
    filter:drop-shadow(0 .3rem .5rem rgba(90,52,18,.22));}

  .chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;}
  .chip{
    padding:.3rem 1.05rem;
    border-radius:999px;
    background:#fff;
    border:.12rem solid rgba(122,85,38,.22);
    box-shadow:0 .16rem 0 rgba(90,52,18,.10);
    font-size:1.15rem;
    font-weight:800;
    color:var(--ink);
  }

  /* 序章的四段旅程 */
  .beats{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;align-items:stretch;margin-top:1.8rem;}
  .beat{
    display:flex;flex-direction:column;justify-content:center;
    min-width:11rem;
    padding:1.1rem 1.3rem;
    border-radius:1.1rem;
    background:#fff;
    border:.14rem solid rgba(122,85,38,.2);
    box-shadow:0 .28rem 0 rgba(90,52,18,.12);
  }
  .beat b{display:block;font-size:2.6rem;line-height:1.1;}
  .beat span{margin-top:.35rem;font-size:1.35rem;font-weight:900;}
  .beat i{font-style:normal;font-size:.95rem;color:var(--ink-2);letter-spacing:.16em;}
  .beat__arrow{align-self:center;font-size:2rem;color:var(--flame);opacity:.65;}

  /* ---------- 封面 ---------- */
  .cover{display:grid;grid-template-columns:1.25fr .75fr;gap:3.5rem;align-items:center;width:100%;max-width:88rem;text-align:left;}
  .cover__logo{width:7rem;height:auto;margin-bottom:1.2rem;}
  .cover__qr{text-align:center;}
  .cover__qr .qr{
    width:min(26rem,30vw);
    margin:0 auto;
    border:.35rem solid #fff;
    box-shadow:0 .5rem 1.4rem rgba(90,52,18,.28);
  }
  .cover__scan{margin:.9rem 0 0;font-size:1.5rem;font-weight:900;color:var(--flame);}
  .cover__url{margin:.2rem 0 0;font-size:1rem;word-break:break-all;color:var(--ink-2);opacity:.75;}

  .crew{margin-top:1.6rem;}
  .crew__count{font-size:2.4rem;font-weight:900;color:var(--teal);}
  .crew__names{
    margin-top:.7rem;
    display:flex;
    flex-wrap:wrap;
    gap:.4rem;
    max-height:9rem;
    overflow:hidden;
  }
  .crew__names .chip{font-size:1rem;animation:pop .45s ease-out;}
  @keyframes pop{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:scale(1);}}

  /* ---------- 題目 ---------- */
  .q{width:100%;max-width:80rem;}
  .q__num{font-size:1.2rem;letter-spacing:.3em;color:var(--flame);font-weight:900;}
  .q__title{margin:.5rem 0 2rem;font-size:3.6rem;font-weight:900;line-height:1.3;}
  .q__opts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:.8rem;
    list-style:none;
    margin:0;padding:0;
    text-align:left;
  }
  .q__opts.one{grid-template-columns:1fr;max-width:50rem;margin:0 auto;}
  .q__opt{
    display:flex;
    align-items:center;
    gap:1rem;
    padding:.85rem 1.3rem;
    border:.14rem solid rgba(122,85,38,.2);
    border-radius:1rem;
    background:#fff;
    box-shadow:0 .22rem 0 rgba(90,52,18,.12);
    font-size:1.65rem;
    font-weight:800;
  }
  .q__key{
    flex:none;
    width:2.5rem;height:2.5rem;
    display:grid;place-items:center;
    border-radius:50%;
    background:linear-gradient(135deg,var(--amber),var(--flame));
    color:#fff;
    font-size:1.2rem;
    font-weight:900;
  }
  .q__done{margin-top:1.8rem;font-size:2rem;font-weight:900;}
  .q__done b{color:var(--teal);font-size:2.8rem;}

  /* 統計長條 */
  .bars{list-style:none;margin:0;padding:0;display:grid;gap:.7rem;width:100%;max-width:72rem;text-align:left;}
  .bar{display:grid;grid-template-columns:3rem 1fr 5rem;align-items:center;gap:1rem;}
  .bar__key{
    width:2.5rem;height:2.5rem;display:grid;place-items:center;border-radius:50%;
    background:linear-gradient(135deg,var(--amber),var(--flame));
    color:#fff;font-weight:900;font-size:1.1rem;
  }
  .bar__track{
    position:relative;height:3.2rem;border-radius:.7rem;
    background:#fff;border:.12rem solid rgba(122,85,38,.18);
    overflow:hidden;
  }
  .bar__fill{
    position:absolute;inset:0 auto 0 0;
    background:linear-gradient(90deg,var(--amber),var(--flame));
    width:0;
    transition:width .9s cubic-bezier(.2,.8,.2,1);
  }
  .bar__label{
    position:absolute;
    inset:0;
    display:flex;align-items:center;
    padding:0 1rem;
    font-size:1.35rem;font-weight:900;
    color:var(--ink);
  }
  .bar__n{font-size:1.6rem;font-weight:900;text-align:right;color:var(--flame);}

  /* ---------- 四象限地圖 ---------- */
  .map{position:relative;width:min(92vw,100vh);aspect-ratio:3/2;}
  .map__grid{
    position:absolute;inset:0;border-radius:1.2rem;overflow:hidden;
    background:
      conic-gradient(from 0deg at 50% 50%,
        rgba(226,98,28,.16)  0deg  90deg,
        rgba(142,69,133,.16) 90deg 180deg,
        rgba(127,180,50,.18) 180deg 270deg,
        rgba(14,140,143,.16) 270deg 360deg),
      #fff;
    border:.16rem solid rgba(122,85,38,.24);
    box-shadow:0 .5rem 1.2rem rgba(90,52,18,.16);
  }
  .map__axis{position:absolute;background:rgba(122,85,38,.3);}
  .map__axis.h{left:0;right:0;top:50%;height:.12rem;}
  .map__axis.v{top:0;bottom:0;left:50%;width:.12rem;}
  .map__q{
    position:absolute;
    padding:.6rem .9rem;
    font-weight:900;
    line-height:1.25;
  }
  .map__q b{display:block;font-size:1.55rem;}
  .map__q i{font-style:normal;font-size:1rem;color:var(--ink-2);}
  .map__q.tl{top:0;left:0;text-align:left;}
  .map__q.tr{top:0;right:0;text-align:right;}
  .map__q.bl{bottom:0;left:0;text-align:left;}
  .map__q.br{bottom:0;right:0;text-align:right;}
  .map__ax{position:absolute;font-size:.95rem;font-weight:900;color:var(--ink-2);opacity:.8;letter-spacing:.1em;}
  .map__ax.up{top:.4rem;left:50%;transform:translateX(-50%);}
  .map__ax.down{bottom:.4rem;left:50%;transform:translateX(-50%);}
  .map__ax.left{left:.5rem;top:50%;transform:translateY(-50%);}
  .map__ax.right{right:.5rem;top:50%;transform:translateY(-50%);}

  .dot{
    position:absolute;
    transform:translate(-50%,-50%) scale(.4);
    opacity:0;
    display:flex;align-items:center;gap:.28rem;
    padding:.2rem .65rem;
    border-radius:999px;
    background:#fff;
    border:.14rem solid currentColor;
    box-shadow:0 .18rem .35rem rgba(90,52,18,.2);
    font-size:1.05rem;
    font-weight:900;
    white-space:nowrap;
    animation:land .5s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  .dot span{color:var(--ink);}
  @keyframes land{to{opacity:1;transform:translate(-50%,-50%) scale(1);}}

  .legend{display:flex;flex-wrap:wrap;gap:.9rem;justify-content:center;margin-top:1.1rem;font-size:1.05rem;font-weight:900;}
  .legend i{font-style:normal;}

  /* ---------- 六大類 ---------- */
  .groups{display:grid;gap:.6rem;width:100%;max-width:78rem;}
  .group{
    display:grid;
    grid-template-columns:14rem 1fr;
    align-items:center;
    gap:1.2rem;
    border-radius:.9rem;
    overflow:hidden;
    text-align:left;
    background:#fff;
    border:.12rem solid rgba(122,85,38,.18);
  }
  .group__name{padding:.9rem 1.2rem;font-size:1.9rem;font-weight:900;}
  .group__desc{font-size:1.3rem;line-height:1.5;padding-right:1rem;color:var(--ink-2);}

  /* ---------- 任務 ---------- */
  .mission{width:100%;max-width:80rem;}
  .mission__icon{font-size:5rem;line-height:1;filter:drop-shadow(0 .3rem .5rem rgba(90,52,18,.22));}
  .mission__say{
    margin:1rem auto 0;
    max-width:56rem;
    padding:1.4rem 2rem;
    border-left:.4rem solid var(--flame);
    border-radius:.3rem 1rem 1rem .3rem;
    background:#fff;
    box-shadow:0 .3rem 0 rgba(90,52,18,.12);
    font-size:2.5rem;
    font-weight:900;
    line-height:1.5;
    text-align:left;
  }
  .timer{
    margin-top:1.6rem;
    font-size:5.5rem;
    font-weight:900;
    letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
    color:var(--teal);
  }
  .timer.low{color:var(--flame);}
  .timer.zero{color:var(--err);animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .timer small{display:block;font-size:1.1rem;font-weight:800;letter-spacing:.2em;color:var(--ink-2);opacity:.75;}

  .foods{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin:1.2rem 0 1rem;}
  .food{
    padding:.45rem 1.1rem;
    border-radius:.7rem;
    border:.12rem solid rgba(64,38,15,.28);
    box-shadow:0 .22rem 0 rgba(90,52,18,.18);
    font-size:1.7rem;
    font-weight:900;
    animation:pop .4s ease-out backwards;
  }
  .why{
    margin:.6rem auto 0;
    max-width:60rem;
    font-size:1.5rem;
    font-weight:800;
    color:var(--ink-2);
  }
  .effects{
    margin:1rem auto 0;
    max-width:74rem;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:.5rem;
    text-align:left;
    font-size:1.02rem;
    line-height:1.45;
  }
  .effects div{
    padding:.45rem .8rem;border-radius:.6rem;
    background:#fff;border:.1rem solid rgba(122,85,38,.16);
    color:var(--ink-2);
  }
  .effects b{color:var(--flame);}

  /* ---------- 三隻猴子 ---------- */
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;width:100%;max-width:80rem;margin-top:1.6rem;}
  .role{
    padding:1.5rem 1.2rem;border-radius:1.2rem;
    background:#fff;border:.14rem solid rgba(122,85,38,.2);
    box-shadow:0 .3rem 0 rgba(90,52,18,.12);
  }
  .role__e{font-size:4rem;line-height:1;}
  .role__n{font-size:1.9rem;font-weight:900;margin:.4rem 0 .5rem;color:var(--flame);}
  .role__r{font-size:1.25rem;line-height:1.55;color:var(--ink-2);}

  .term{
    font-size:9rem;
    font-weight:900;
    line-height:1.1;
    letter-spacing:.04em;
    background:linear-gradient(150deg,#F2A72C 0%,#E2621C 48%,#C4453B 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 .12rem 0 rgba(255,255,255,.85));
    animation:pop .35s ease-out;
  }
  .term__n{font-size:1.2rem;letter-spacing:.3em;color:var(--ink-2);opacity:.8;font-weight:800;}

  /* ---------- 大合照 ---------- */
  .count3{
    font-size:16rem;font-weight:900;line-height:1;
    background:linear-gradient(150deg,#F2A72C,#E2621C 50%,#C4453B);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:pop .4s ease-out;
  }

  /* ---------- 影片 ---------- */
  .video{position:fixed;inset:0;z-index:2;background:#000;display:grid;place-items:center;}
  .video video{width:100%;height:100%;object-fit:contain;background:#000;}

  /* ---------- 控制列 ---------- */
  .bar-ui{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:5;
    display:flex;
    align-items:center;
    gap:.75rem;
    padding:.55rem 1rem;
    background:rgba(255,251,240,.96);
    border-top:.1rem solid rgba(122,85,38,.25);
    box-shadow:0 -.3rem .8rem rgba(90,52,18,.12);
    color:var(--ink);
    font-size:.95rem;
    opacity:0;
    transform:translateY(110%);
    transition:opacity .25s ease, transform .25s ease;
  }
  body.show-ui .bar-ui{opacity:1;transform:none;}
  .bar-ui button{
    font-family:inherit;
    font-size:.95rem;
    font-weight:900;
    padding:.35rem .9rem;
    border-radius:.55rem;
    border:.1rem solid rgba(122,85,38,.3);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .bar-ui button:hover{background:var(--paper-2);border-color:var(--flame);}
  .bar-ui .grow{flex:1;text-align:center;color:var(--ink-2);}
  .bar-ui kbd{
    font:inherit;font-size:.8rem;padding:0 .3rem;border-radius:.25rem;
    background:var(--paper-2);border:.06rem solid rgba(122,85,38,.3);
  }
  .net{font-weight:900;}
  .net.on{color:var(--teal);}
  .net.off{color:var(--err);}

  /* ---------- 跳關選單 ---------- */
  .menu{
    position:fixed;inset:0;z-index:6;
    background:rgba(253,242,216,.98);
    padding:2.5rem;
    overflow:auto;
    color:var(--ink);
  }
  .menu h2{margin:0 0 1rem;font-size:1.8rem;color:var(--flame);}
  .menu ol{list-style:none;margin:0;padding:0;columns:3;column-gap:1.5rem;}
  .menu li{break-inside:avoid;margin-bottom:.3rem;}
  .menu button{
    width:100%;
    text-align:left;
    font-family:inherit;
    font-size:1.02rem;
    padding:.35rem .7rem;
    border-radius:.5rem;
    border:none;
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .menu button:hover{background:#fff;}
  .menu button.now{background:var(--flame);color:#fff;font-weight:900;}
  .menu .part{margin-top:.8rem;font-size:.9rem;letter-spacing:.2em;color:var(--flame);font-weight:900;}
</style>
</head>

<div class="deco" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <path d="M120 780 C 380 700, 300 500, 560 470 S 900 520, 1010 360 S 1280 250, 1470 150"
          fill="none" stroke="#8C3A1E" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="26 26"/>
    <g transform="translate(1330 720)" stroke="#5A3412" fill="none" stroke-width="5">
      <circle r="130"/><circle r="104"/>
      <path d="M0 -150 L26 -26 L150 0 L26 26 L0 150 L-26 26 L-150 0 L-26 -26 Z" fill="#8C3A1E" stroke="none"/>
      <path d="M0 -120 L0 120 M-120 0 L120 0" stroke-width="3"/>

  </svg>
</div>

<div class="rail">
  <span class="rail__room" id="railroom"></span>
  <span class="rail__keys" id="railkeys"></span>
</div>

<main class="screen" id="screen"></main>

<div class="bar-ui">
  <button type="button" data-go="-1">← 上一步</button>
  <button type="button" data-go="1">下一步 →</button>
  <button type="button" id="b-menu">跳關 (Esc)</button>
  <button type="button" id="b-full">全螢幕 (F)</button>
  <span class="grow" id="barinfo"></span>
  <span class="net" id="netinfo">連線中…</span>
</div>

<div class="menu" id="menu" hidden>
  <h2>跳到哪一關？（Esc 關閉）</h2>
  <ol id="menulist"></ol>
</div>

<script src="assets/firebase-config.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/quiz-data.js"></script>
<script src="assets/cards-data.js"></script>
<script src="assets/monkeys-data.js"></script>
<script src="assets/net.js"></script>
<script>
(function () {
  "use strict";

  var QUIZ = window.CDVC_QUIZ;
  var CARDS = window.CDVC_CARDS;
  var MONKEY = window.CDVC_MONKEYS;
  var NET = window.CDVC_NET;
  var QR = window.CDVC_QR;

  var $ = function (id) { return document.getElementById(id); };
  var KEYS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  /* ============================================================
     劇情：認識自己 → 找到同伴 → 實踐服務 → 發現寶藏就在自己身上
     流程是一維陣列，主持人一直按右鍵就會走完
     ============================================================ */
  var PARTS = {
    intro: { name: "序章・藏寶圖" },
    q1: { name: "第一關・認識自己", key: "🧭" },
    q2: { name: "第二關・找到同伴", key: "🍲" },
    q3: { name: "第三關・實踐服務", key: "🤝" },
    q4: { name: "第四關・開箱", key: "💎" },
    end: { name: "終章・啟航" }
  };

  var S = [];
  function add(o) { S.push(o); }

  add({ part: "intro", kind: "cover", label: "封面・QR code" });
  add({ part: "intro", kind: "rules", label: "序章：四段旅程" });

  AFTER.map = function (sc, el) {
    var box = el.querySelector("#map");
    var pts = roster().map(function (p) {
      var pos = QUIZ.position(p.answers);
      if (!pos) { return null; }
      return { name: p.name, type: QUIZ.typeOf(p.answers), x: pos.x, y: pos.y };
    }).filter(Boolean);

    if (!pts.length) {
      box.insertAdjacentHTML("beforeend",
        '<p class="quiet" style="position:absolute;inset:auto 0 45% 0;font-size:1.4rem">還沒有人作答</p>');
      return;
    }

    // 用格子搶位子，保證名字不會疊在一起
    var cols = 22, rows = 13;
    var taken = {};
    function free(c, r) {
      return c >= 0 && r >= 0 && c < cols && r < rows && !taken[c + "," + r];
    }

    pts.forEach(function (p, n) {
      var c0 = Math.round((p.x + 1) / 2 * (cols - 1));
      var r0 = Math.round((1 - p.y) / 2 * (rows - 1));
      var c = c0, r = r0, found = free(c0, r0);

      for (var rad = 1; !found && rad < Math.max(cols, rows); rad++) {
        for (var dr = -rad; dr <= rad && !found; dr++) {
          for (var dc = -rad; dc <= rad && !found; dc++) {
            if (Math.max(Math.abs(dr), Math.abs(dc)) !== rad) { continue; }
            if (free(c0 + dc, r0 + dr)) { c = c0 + dc; r = r0 + dr; found = true; }
          }
        }
      }
      if (!found) { return; }
      taken[c + "," + r] = true;

      var t = QUIZ.TYPES[p.type];
      var left = (c + 0.5) / cols * 100;
      var top = (r + 0.5) / rows * 100;
      box.insertAdjacentHTML("beforeend",
        '<span class="dot" style="left:' + left.toFixed(2) + "%;top:" + top.toFixed(2) +
        "%;color:" + t.color + ";animation-delay:" + (n * 0.045).toFixed(2) + 's">' +
        t.emoji + "<span>" + esc(p.name) + "</span></span>");
    });
  };

      '<p class="term__n">第 ' + (termAt + 1) + " 題　/　題庫共 " + deck.length + " 題</p>" +
      '<div class="term">' + esc(t.t) + "</div>" +
      '<p class="lede quiet" style="margin-top:2rem">🙊 比劃猴：只能比，不能說　·　🙉 傳話猴：只能說　·　🙈 猜題猴：閉眼</p>';
  };

  VIEWS.photo = function () {
    if (photoCount > 0) {
      return '<div class="count3">' + (photoCount === 4 ? "📸" : photoCount) + "</div>";
    }
    return '' +
      '<span class="emoji">📸</span>' +
      '<h1 class="huge">全體船員集合</h1>' +
      '<p class="lede">往中間靠，後排站高一點，<br>手上的食材卡舉起來。</p>' +
      '<p class="big" style="margin-top:1.5rem;color:var(--flame)">口號：崇德——志工！</p>' +
      '<p class="quiet" style="margin-top:1rem;font-size:1.2rem">主持人按 <kbd>T</kbd> 開始 3・2・1</p>';
  };

  VIEWS.finale = function () {
    return '' +
      '<div class="beats" style="margin-bottom:1.6rem">' +
        BEATS.map(function (b, n) {
          return (n ? '<span class="beat__arrow">→</span>' : "") +
            '<div class="beat" style="min-width:8rem"><b>' + b[0] + "</b>" +
            "<span>" + esc(b[1]) + "</span></div>";
        }).join("") +
      "</div>" +
      '<h1 class="huge">寶藏就在你身上</h1>' +
      '<p class="lede">你們找了一整晚——<br>認識了自己，遇到了同伴，也真的動手做了一次。<br>' +
        "<b>那些東西，早就跟著你走進這個場地了。</b></p>" +
      '<p class="eyebrow" style="margin-top:2rem">按 → 啟航</p>';
  };

  VIEWS.video = function () {
    return '<div class="video"><video src="media/ship_moving.mp4" controls playsinline></video></div>';
  };

  AFTER.video = function (sc, el) {
    var v = el.querySelector("video");
    v.play()["catch"](function () { /* 瀏覽器擋掉就讓主持人自己按 */ });
  };

  VIEWS.outro = function () {
    return '' +
      '<img class="cover__logo" src="assets/logo1.webp" alt="崇德志工社" style="width:9rem">' +
      '<h1 class="huge">歡迎上船</h1>' +
      '<p class="lede">每週三 18:30，伙食團等你來開伙。</p>' +
      '<div class="qr" id="qr2" style="width:16rem;margin:1.5rem auto 0;border:.35rem solid #fff;' +
        'box-shadow:0 .4rem 1rem rgba(90,52,18,.25)"></div>' +
      '<p class="eyebrow" style="margin-top:.8rem">追蹤我們</p>';
  };

  AFTER.outro = function () {
    var url = (window.CDVC_CONFIG || {}).socialUrl;
    if (!url) { return; }
    try { $("qr2").innerHTML = QR.svg(url, { dark: "#40260F" }); } catch (e) { /* 忽略 */ }
  };

  /* ============================================================
     計時器
     ============================================================ */
  function startTimer(sec) {
    timer.total = sec;
    timer.left = sec;
    timer.running = true;
    paintTimer();
  }

  function paintTimer() {
    var el = $("clock");
    if (!el) { return; }
    var m = Math.floor(timer.left / 60), s = timer.left % 60;
    el.className = "timer" + (timer.left === 0 ? " zero" : (timer.left <= 15 ? " low" : ""));
    el.innerHTML = m + ":" + (s < 10 ? "0" : "") + s +
      "<small>" + (timer.left === 0 ? "時間到" : (timer.running ? "討論時間" : "暫停中")) + "</small>";
  }

  setInterval(function () {
    if (!timer.running || timer.left <= 0) { return; }
    timer.left--;
    if (timer.left === 0) { timer.running = false; }
    paintTimer();
  }, 1000);

  /* ============================================================
     操作
     ============================================================ */
  function go(delta) {
    var next = i + delta;
    if (next < 0 || next >= S.length) { return; }
    i = next;
    render();
  }

  function jump(n) {
    i = Math.max(0, Math.min(S.length - 1, n));
    render();
  }

  function broadcast() {
    var sc = S[i];
    NET.setState({
      i: i,
      part: sc.part,
      kind: sc.kind,
      label: sc.label,
      qi: sc.qi === undefined ? null : sc.qi,
      sub: sc.sub || null,
      mi: sc.mi === undefined ? null : sc.mi,
      pkey: sc.pkey || null,
      term: sc.kind === "monkeyPlay" ? deck[termAt % deck.length].t : null,
      total: S.length
    });
  }

  document.addEventListener("keydown", function (e) {
    var sc = S[i];

    if (e.key === "Escape") {
      e.preventDefault();
      toggleMenu();
      return;
    }
    if (!$("menu").hidden) { return; }

    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") {
      e.preventDefault();
      // 三隻猴子停在同一頁換題，Shift 才離開
      if (sc.kind === "monkeyPlay" && !e.shiftKey) {
        termAt++;
        render();
        return;
      }
      go(1);
      return;
    }

    if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      if (sc.kind === "monkeyPlay" && !e.shiftKey && termAt > 0) {
        termAt--;
        render();
        return;
      }
      go(-1);
      return;
    }

    var k = e.key.toLowerCase();

    if (k === "f") { toggleFull(); return; }

    if (k === "t") {
      if (sc.kind === "photo") { runPhotoCountdown(); return; }
      if (timer.left > 0) { timer.running = !timer.running; paintTimer(); }
      else if (sc.kind === "mission" && sc.sub === "ask") { startTimer(90); }
      return;
    }

    if (k === "r") {
      if (sc.kind === "mission" && sc.sub === "ask") { startTimer(90); }
      if (sc.kind === "monkeyPlay") { deck = MONKEY.shuffled(); termAt = 0; render(); }
      if (sc.kind === "photo") { photoCount = 0; render(); }
      return;
    }
  });

  function runPhotoCountdown() {
    if (photoCount) { return; }
    var seq = [3, 2, 1, 4];   // 4 是快門那一格
    var at = 0;
    (function step() {
      photoCount = seq[at];
      render();
      at++;
      if (at < seq.length) { setTimeout(step, 1000); }
      else { setTimeout(function () { photoCount = 0; render(); }, 2500); }
    })();
  }

  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen()["catch"](function () {}); }
  }

  function toggleMenu() {
    var m = $("menu");
    if (m.hidden) { buildMenu(); m.hidden = false; }
    else { m.hidden = true; }
  }

  function buildMenu() {
    var lastPart = "";
    $("menulist").innerHTML = S.map(function (sc, n) {
      var head = "";
      if (sc.part !== lastPart) {
        lastPart = sc.part;
        head = '<li class="part">' + esc(PARTS[sc.part].name) + "</li>";
      }
      return head + '<li><button type="button" data-jump="' + n + '"' +
        (n === i ? ' class="now"' : "") + ">" + (n + 1) + ". " + esc(sc.label) + "</button></li>";
    }).join("");
  }

  $("menu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-jump]");
    if (!b) { return; }
    $("menu").hidden = true;
    jump(Number(b.getAttribute("data-jump")));
  });

  document.querySelector(".bar-ui").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) { return; }
    if (b.hasAttribute("data-go")) { go(Number(b.getAttribute("data-go"))); }
    if (b.id === "b-menu") { toggleMenu(); }
    if (b.id === "b-full") { toggleFull(); }
  });

  /* 滑鼠不動就把控制列收起來，投影幕上乾淨一點 */
  var hideAt = null;
  function poke() {
    document.body.classList.add("show-ui");
    clearTimeout(hideAt);
    hideAt = setTimeout(function () {
      document.body.classList.remove("show-ui");
    }, 3000);
  }
  document.addEventListener("mousemove", poke);
  poke();

  /* ============================================================
     連線
     ============================================================ */
  NET.onStatus = function (ok) {
    var el = $("netinfo");
    el.className = "net " + (ok ? "on" : "off");
    el.textContent = ok ? "● 已連線" : "● 連線中斷，檢查網路";
  };

  NET.init("stage").then(function (r) {
    var el = $("netinfo");
    el.className = "net off";
    el.textContent = (r.mode === "firebase")
      ? "● 連線中…"
      : "● 本機模式：找不到 Firebase 設定（鍵盤照常可用）";
    broadcast();
  });

  NET.onPlayers(function (p) {
    players = p || {};
    var sc = S[i];
    // 只重畫會變的部分，不要整頁重刷，不然動畫會一直重跑
    if (sc.kind === "cover") { paintCrew(); }
    else if (sc.kind === "question" && sc.sub === "answer") { paintAnswered(sc.qi); }
  });

  render();
})();
</script>
</body>
</html>
